services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bonny-cloudflared
    command: tunnel run frontend-bonny
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 100m
    networks:
      - bonnyfrontend
  homepage:
    build:
      context: ./
      dockerfile: Dockerfile.homepage
    volumes:
      - ${CERT_PATH}/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ${CERT_PATH}/privkey.pem:/etc/ssl/private/privkey.pem:ro
    container_name: bonny-homepage
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 20m
    networks:
      - bonnyfrontend

networks:
  bonnyfrontend: