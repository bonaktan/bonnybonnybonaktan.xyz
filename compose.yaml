services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bonny-cloudflared
    command: tunnel run frontend-bonny
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 100m
    networks:
      - bonnyfrontend
  homepage:
    build:
      context: ./
      dockerfile: Dockerfile.homepage
    container_name: bonny-homepage
    cpus: "0.25"
    mem_limit: 8m
    networks:
      - bonnyfrontend

networks:
  bonnyfrontend: